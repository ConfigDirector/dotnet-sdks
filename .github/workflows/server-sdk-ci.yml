name: server-sdk-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keeps the same commands working on the Windows runner as on the others.
defaults:
  run:
    shell: bash

env:
  # Release is what gets packed and published, so it is what CI builds and tests.
  CONFIGURATION: Release
  # MSBuild reads the environment as properties, so every dotnet command below sees this and the
  # samples build against the SDK in this checkout instead of the published package. Restore and
  # build have to agree on it, which is why it is set here rather than passed to one command.
  UseLocalSdk: true

jobs:
  build:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      # TreatWarningsAsErrors is on, so an analyzer or code-style violation fails here.
      - run: dotnet build -c "$CONFIGURATION"

      - run: dotnet test -c "$CONFIGURATION" --no-build

      # Outside the solution, so building it here is what stops it rotting between nightly runs.
      - run: |
          dotnet build tests/ConfigDirector.ServerSdk.SlowTests/ConfigDirector.ServerSdk.SlowTests.csproj \
            -c "$CONFIGURATION"

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      # Whitespace and ordering, which building does not check.
      - run: dotnet format --verify-no-changes

  os-compatibility:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - run: dotnet test -c "$CONFIGURATION"

  native-aot:
    name: Native AOT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      # The prerequisites for compiling to native code, which the runner image does not carry.
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # ILC analyses the whole program, so it sees through the SDK's dependencies in a way the
      # per-assembly analyzer on the ordinary build cannot. TreatWarningsAsErrors turns anything it
      # finds into a failure here.
      - run: |
          dotnet publish samples/ConfigDirector.Samples.NativeAot \
            -c "$CONFIGURATION" -r linux-x64 -o aot

      # Publishing clean is not the same as working: metadata the trimmer drops fails at runtime.
      - run: scripts/verify-native-aot.sh aot/ConfigDirector.Samples.NativeAot

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - run: dotnet pack -c "$CONFIGURATION" -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
