name: server-sdk-release

# Tagging is what publishes. The tag carries the version, so nothing in the repository has to be
# edited to cut a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, with or without the leading v (packs and uploads, publishes nothing)."
        required: true

permissions:
  contents: read

env:
  CONFIGURATION: Release

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - name: Resolve the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="$GITHUB_REF_NAME"
          fi
          version="${version#v}"

          # A malformed tag would otherwise publish a package nobody can refer to.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version. Tag releases as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release is never published from code that does not build clean or pass.
      - run: dotnet build -c "$CONFIGURATION"

      - run: dotnet test -c "$CONFIGURATION" --no-build

      - run: |
          dotnet pack src/ConfigDirector.ServerSdk/ConfigDirector.ServerSdk.csproj \
            -c "$CONFIGURATION" \
            -p:Version="${{ steps.version.outputs.version }}" \
            -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    name: Publish
    needs: pack
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # id-token lets nuget.org verify this workflow through OIDC and hand back a short-lived key,
      # so no long-lived credential is stored anywhere. contents is for the GitHub release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # Exchanges this run's OIDC token for a key that expires within the hour. The trusted
      # publishing policy on nuget.org decides whether to issue one, matching on this repository,
      # this workflow file, and the tag it was triggered by.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # The symbol package next to it is pushed with it.
      - run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
