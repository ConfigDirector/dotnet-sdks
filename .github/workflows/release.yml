name: release

# Tagging is what publishes. The tag names the package and the version it is releasing:
#
#   ConfigDirector.ServerSdk-v1.1.0
#   ConfigDirector.ServerSdk.AspNetCore-v1.0.0
#   ConfigDirector.OpenFeature.ServerProvider-v1.0.0
#
# The version itself lives in the project, and this workflow checks the tag against it rather than
# passing one in. A -p:Version override is a global MSBuild property: it flows across a
# ProjectReference, so packing one package would stamp the wrong dependency version on the package
# it depends on.
#
# One workflow serves every package, since a package's project path follows its id. Releases before
# this scheme were tagged v1.0.0, which this workflow deliberately no longer matches.
#
# The ConfigDirector.ServerSdk tag also releases ConfigDirector.ServerSdk.Testing and
# ConfigDirector.ServerSdk.AspNetCore.Testing. They rely on the SDK's internals, carry its version,
# and pin it exactly, so they are packed with it and pushed after it, one at a time, as nuget.org
# indexes each one. They cannot be tagged on their own.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package id to rehearse, e.g. ConfigDirector.ServerSdk. Packs and uploads at the version in the project, and publishes nothing."
        required: true

permissions:
  contents: read

env:
  CONFIGURATION: Release
  # The build that gates a release checks the samples against the code being released, not against
  # whatever version is already on nuget.org.
  UseLocalSdk: true

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package: ${{ steps.release.outputs.package }}
      packages: ${{ steps.release.outputs.packages }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - name: Resolve the package
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            package="${{ inputs.package }}"
            tagged=""
          else
            tag="$GITHUB_REF_NAME"

            # Split at the last "-v". Two parameter expansions rather than one pattern: a package
            # id carries dots and may carry hyphens, and each half is checked on its own below.
            package="${tag%-v*}"
            tagged="${tag##*-v}"

            if [ "$package" = "$tag" ]; then
              echo "::error::'$tag' is not a release tag. Tag releases as <PackageId>-v1.2.3."
              exit 1
            fi

            # A malformed version would otherwise publish a package nobody can refer to.
            if ! printf '%s' "$tagged" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::'$tagged' is not a semantic version. Tag releases as <PackageId>-v1.2.3 or <PackageId>-v1.2.3-beta.1."
              exit 1
            fi
          fi

          # Also what keeps the package id out of the path below.
          if ! printf '%s' "$package" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::'$package' is not a package id."
            exit 1
          fi

          project="src/$package/$package.csproj"
          if [ ! -f "$project" ]; then
            echo "::error::'$package' names no package in this repository: $project does not exist."
            exit 1
          fi

          # The testing packages ship from the SDK's tag, in dependency order.
          case "$package" in
            ConfigDirector.ServerSdk.Testing | ConfigDirector.ServerSdk.AspNetCore.Testing)
              echo "::error::$package is released with ConfigDirector.ServerSdk and carries its version. Tag ConfigDirector.ServerSdk-v<version> instead, which publishes all three."
              exit 1
              ;;
            ConfigDirector.ServerSdk)
              packages="$package ConfigDirector.ServerSdk.Testing ConfigDirector.ServerSdk.AspNetCore.Testing"
              ;;
            *)
              packages="$package"
              ;;
          esac

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      # A release is never published from code that does not build clean or pass. The whole
      # solution, not just the package being released: a package here can depend on another.
      - run: dotnet build -c "$CONFIGURATION"

      # After the build, so the project has restored before it is evaluated. The version comes
      # from the project; a tag that disagrees with it is the tag being wrong.
      - name: Resolve the version
        id: version
        run: |
          project="${{ steps.release.outputs.project }}"
          tagged="${{ steps.release.outputs.tagged }}"
          declared="$(dotnet msbuild "$project" -getProperty:Version -nologo)"

          if [ -n "$tagged" ] && [ "$tagged" != "$declared" ]; then
            echo "::error::'$GITHUB_REF_NAME' releases $tagged but $project declares $declared. Bump VersionPrefix, and VersionSuffix for a prerelease, in a commit and tag that commit."
            exit 1
          fi

          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - run: dotnet test -c "$CONFIGURATION" --no-build --timeout 5m

      # Every package, not just the one being released, so a package that depends on another one
      # here is restored against the sibling it was built with rather than what nuget.org has.
      - run: dotnet pack -c "$CONFIGURATION" -o restore-check

      - run: scripts/verify-packages-restore.sh restore-check/*.nupkg

      - run: |
          for package in ${{ steps.release.outputs.packages }}; do
            dotnet pack "src/$package/$package.csproj" -c "$CONFIGURATION" -o artifacts
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    name: Publish
    needs: pack
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Room for nuget.org to index each of the SDK's companion packages before the next is pushed.
    timeout-minutes: 60
    permissions:
      # id-token lets nuget.org verify this workflow through OIDC and hand back a short-lived key,
      # so no long-lived credential is stored anywhere. contents is for the GitHub release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # Before the credential is fetched, so an out-of-order release fails having published
      # nothing. Two release tags pushed together run in parallel and in no particular order. The
      # first package is the tagged one; the packages after it depend on it and are checked again
      # below, once it has been pushed and indexed.
      - run: scripts/verify-dependencies-published.sh "artifacts/$(echo "${{ needs.pack.outputs.packages }}" | cut -d' ' -f1).${{ needs.pack.outputs.version }}.nupkg"

      # Exchanges this run's OIDC token for a key that expires within the hour. The trusted
      # publishing policy on nuget.org decides whether to issue one, matching on this repository,
      # this workflow file, and the tag it was triggered by. Each package id needs its own policy.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # In dependency order. The symbol package next to each one is pushed with it. A package that
      # pins the one before it exactly is pushed only once nuget.org has indexed that one, since
      # nuget.org would otherwise accept a package nobody can restore. --skip-duplicate lets a
      # failed run be re-run: what was pushed already is skipped and the rest continues.
      - run: |
          version="${{ needs.pack.outputs.version }}"
          packages=(${{ needs.pack.outputs.packages }})
          last=$(( ${#packages[@]} - 1 ))

          for index in "${!packages[@]}"; do
            package="${packages[$index]}"
            nupkg="artifacts/$package.$version.nupkg"

            scripts/verify-dependencies-published.sh "$nupkg"

            dotnet nuget push "$nupkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate

            if [ "$index" -lt "$last" ]; then
              scripts/wait-for-package-indexed.sh "$package" "$version"
            fi
          done

      - run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg \
            --title "${{ needs.pack.outputs.package }} ${{ needs.pack.outputs.version }}" \
            --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
