name: release

# Tagging is what publishes. The tag carries the version, so nothing in the repository has to be
# edited to cut a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (packs and uploads, publishes nothing)."
        required: true

permissions:
  contents: read

env:
  CONFIGURATION: Release

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - name: Read the version from the tag
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # A malformed tag would otherwise publish a package nobody can refer to.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version. Tag releases as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release is never published from code that does not build clean or pass.
      - run: dotnet build -c "$CONFIGURATION"

      - run: dotnet test -c "$CONFIGURATION" --no-build

      - run: |
          dotnet pack src/ConfigDirector.ServerSdk/ConfigDirector.ServerSdk.csproj \
            -c "$CONFIGURATION" \
            -p:Version="${{ steps.version.outputs.version }}" \
            -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    name: Publish
    needs: pack
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated so a release can require a human before anything reaches nuget.org, which cannot be
    # undone: a published version is permanent, only delistable.
    environment: nuget
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@v7
        with:
          name: nupkg
          path: artifacts

      # The symbol package next to it is pushed with it.
      - run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
