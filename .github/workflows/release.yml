name: release

# Manual by design, as in every other SDK repository: releases whatever version the chosen
# package's project declares on the chosen branch, and tags the released commit last, once nuget.org
# has what the tag names. The tag names the package and the version:
#
#   ConfigDirector.ServerSdk-v1.11.0
#   ConfigDirector.ServerSdk.AspNetCore-v1.11.0
#   ConfigDirector.OpenFeature.ServerProvider-v1.8.1
#
# The version itself lives in the project and is never passed in. A -p:Version override is a global
# MSBuild property: it flows across a ProjectReference, so packing one package would stamp the wrong
# dependency version on the package it depends on.
#
# One workflow serves every package, since a package's project path follows its id. What a release
# publishes and tags is decided by scripts/release-plan.sh: a release of ConfigDirector.ServerSdk
# also publishes ConfigDirector.ServerSdk.Testing and ConfigDirector.ServerSdk.AspNetCore.Testing,
# which carry the SDK's version, and ConfigDirector.ServerSdk.AspNetCore when the version it
# declares is new. The packages are pushed in dependency order, each once nuget.org has indexed
# what it depends on, so one run releases the whole set without failing on the way.
#
# Releases before 2026-11-07 were published by pushing the tag; releases before that scheme were
# tagged v1.0.0. The tag names are unchanged, so the changelogs' compare links keep working.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package id to release at the version its project declares, e.g. ConfigDirector.ServerSdk, ConfigDirector.ServerSdk.AspNetCore or ConfigDirector.OpenFeature.ServerProvider."
        required: true
      rehearsal:
        description: "Pack and upload the packages as a workflow artifact without publishing or tagging anything."
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: two could otherwise plan against the same nuget.org state.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  # The build that gates a release checks the samples against the code being released, not against
  # whatever version is already on nuget.org.
  UseLocalSdk: true
  PACKAGE: ${{ inputs.package }}

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      # A release is never published from code that does not build clean or pass. The whole
      # solution, not just the package being released: a package here can depend on another.
      - run: dotnet build -c "$CONFIGURATION"

      # After the build, so the projects have restored before their versions are read. Decides
      # what this release publishes and tags, and refuses a version that is on nuget.org or tagged
      # already, or that has no changelog section to publish as its release notes.
      - name: Plan the release
        run: scripts/release-plan.sh "$PACKAGE" artifacts/release-plan

      - run: dotnet test -c "$CONFIGURATION" --no-build --timeout 5m

      # Every package, not just the ones being released, so a package that depends on another one
      # here is restored against the sibling it was built with rather than what nuget.org has.
      - run: dotnet pack -c "$CONFIGURATION" -o restore-check

      - run: scripts/verify-packages-restore.sh restore-check/*.nupkg

      - name: Pack the packages the plan publishes
        run: |
          while read -r decision id _version; do
            [ "$decision" = publish ] || continue
            dotnet pack "src/$id/$id.csproj" -c "$CONFIGURATION" -o artifacts
          done < artifacts/release-plan

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            artifacts/release-plan
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    name: Publish
    needs: pack
    if: ${{ !inputs.rehearsal }}
    runs-on: ubuntu-latest
    # Room for nuget.org to index each package before the one depending on it is pushed.
    timeout-minutes: 60
    permissions:
      # id-token lets nuget.org verify this workflow through OIDC and hand back a short-lived key,
      # so no long-lived credential is stored anywhere. contents is for the tags and the GitHub
      # releases.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: artifacts

      # Before the credential is fetched, since the key it yields expires within the hour: a package
      # released on its own may depend on a release that nuget.org is still indexing. The packages
      # after the first depend on it and wait their turn below.
      - name: Wait for what the first package depends on
        run: |
          read -r _decision id version < artifacts/release-plan
          scripts/wait-for-dependencies-indexed.sh "artifacts/$id.$version.nupkg"

      # Exchanges this run's OIDC token for a key that expires within the hour. The trusted
      # publishing policy on nuget.org decides whether to issue one, matching on this repository and
      # this workflow's file name. Each package id needs its own policy.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # In dependency order. The symbol package next to each one is pushed with it. A package is
      # pushed only once nuget.org has indexed every package here it depends on, since nuget.org
      # would otherwise accept a package nobody can restore. --skip-duplicate lets a run that
      # failed partway, for a reason outside this repository, be re-run from its failed job: what
      # was pushed already is skipped and the rest continues.
      - name: Push the packages
        run: |
          while read -r decision id version; do
            [ "$decision" = publish ] || continue
            nupkg="artifacts/$id.$version.nupkg"

            scripts/wait-for-dependencies-indexed.sh "$nupkg"

            dotnet nuget push "$nupkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done < artifacts/release-plan

      - name: Tag the released commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          while read -r decision tag id version; do
            [ "$decision" = tag ] || continue
            git tag -a "$tag" -m "$id $version"
            git push origin "$tag"
          done < artifacts/release-plan

      # One GitHub release per tag, with the package's changelog section as its notes and the
      # packages it ships attached: the SDK's carries the two testing packages. --verify-tag
      # refuses to invent a tag should the push above not have landed.
      - name: Create the GitHub releases from the changelog sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r decision tag id version; do
            [ "$decision" = tag ] || continue

            scripts/release-notes.sh "$id" "$version" > "$RUNNER_TEMP/$tag.md"

            files=("artifacts/$id.$version.nupkg")
            if [ "$id" = ConfigDirector.ServerSdk ]; then
              files+=("artifacts/ConfigDirector.ServerSdk.Testing.$version.nupkg" "artifacts/ConfigDirector.ServerSdk.AspNetCore.Testing.$version.nupkg")
            fi

            prerelease=()
            case "$version" in
              *-*) prerelease=(--prerelease) ;;
            esac

            gh release create "$tag" "${files[@]}" \
              --verify-tag \
              --title "$id $version" \
              --notes-file "$RUNNER_TEMP/$tag.md" \
              "${prerelease[@]}"
          done < artifacts/release-plan
